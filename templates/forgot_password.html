<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | KUCET Smart Agriculture</title>
  <style>
    body { margin:0; font-family:'Segoe UI',sans-serif; background:linear-gradient(135deg,#0b2b18,#144d2b); color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-radius:16px; padding:32px; width:340px; }
    h2 { margin:0 0 16px; font-size:20px; color:#86efac; }
    input { width:100%; box-sizing:border-box; padding:10px 12px; margin-bottom:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff; }
    button { width:100%; padding:11px; border:none; border-radius:8px; background:#22c55e; color:#052e16; font-weight:700; cursor:pointer; }
    .msg { color:#86efac; font-size:13px; margin-bottom:10px; }
    .err { color:#fca5a5; font-size:13px; margin-bottom:10px; }
    a { display:block; text-align:center; margin-top:14px; color:#86efac; font-size:13px; text-decoration:none; }
  </style>
</head>
<body>
  <form class="card" method="POST">
    <h2>Reset Password</h2>
    {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="text" name="username" placeholder="Username (admin)" required />
    <input type="text" name="security_pin" placeholder="Security PIN (1234)" required />
    <input type="password" name="new_password" placeholder="New Password" required />
    <button type="submit">Update Password</button>
    <a href="/login">Back to Login</a>
  </form>
</body>
</html>
